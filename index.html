  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global Firebase Config & Setup
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'skladnikpro-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "AIzaSyDemoKeySkladnikPro1234567890",
      authDomain: "skladnikpro-demo.firebaseapp.com",
      projectId: "skladnikpro-demo",
      storageBucket: "skladnikpro-demo.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:demo1234567890"
    };

    let app, db, auth;
    try {
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);
    } catch(e) {
      console.warn("Firebase Init fallback:", e);
    }

    window.CloudSync = {
      appId,
      db,
      auth,
      currentUser: null,
      activeSyncRoom: null,
      unsubscribeListener: null,

      async initAuth() {
        if (!auth) return null;
        return new Promise((resolve) => {
          onAuthStateChanged(auth, async (user) => {
            if (user) {
              this.currentUser = user;
              resolve(user);
            } else {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  const res = await signInWithCustomToken(auth, __initial_auth_token);
                  this.currentUser = res.user;
                } else {
                  const res = await signInAnonymously(auth);
                  this.currentUser = res.user;
                }
                resolve(this.currentUser);
              } catch(err) {
                console.error("Auth error:", err);
                resolve(null);
              }
            }
          });
        });
      },

      async joinRoom(roomCode) {
        if (!db) {
          showToast("Cloudové rozhraní není dostupné.");
          return;
        }
        await this.initAuth();
        if (!this.currentUser) return;

        const cleanRoom = roomCode.toUpperCase().trim();
        if (!cleanRoom) return;

        this.activeSyncRoom = cleanRoom;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'sync_rooms', cleanRoom);

        if (this.unsubscribeListener) this.unsubscribeListener();

        this.unsubscribeListener = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data && data.sapProducts) {
              sapProducts = data.sapProducts;
              if (typeof renderSAPProducts === 'function') renderSAPProducts();
            }
            if (data && data.lastUpdatedBy) {
              const statusElem = document.getElementById('cloudSyncStatusText');
              if (statusElem) statusElem.innerText = `Aktivní synch (Místnost: ${cleanRoom})`;
            }
            showToast(`Data synchronizována z místnosti ${cleanRoom}`);
          }
        }, (err) => {
          console.error("Sync Snapshot Error:", err);
        });

        // Save initial state if room does not exist
        const snap = await getDoc(docRef);
        if (!snap.exists()) {
          await setDoc(docRef, {
            createdAt: new Date().toISOString(),
            roomCode: cleanRoom,
            sapProducts: sapProducts || [],
            lastUpdatedBy: this.currentUser.uid
          });
        }

        document.getElementById('syncRoomInput').value = cleanRoom;
        document.getElementById('currentRoomBadge').innerText = cleanRoom;
        document.getElementById('syncStatusCard').classList.remove('hidden');
        showToast(`Připojeno k synchronizační místnosti ${cleanRoom}`);
      },

      async pushState() {
        if (!db || !this.activeSyncRoom) return;
        await this.initAuth();
        if (!this.currentUser) return;

        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'sync_rooms', this.activeSyncRoom);
        try {
          await setDoc(docRef, {
            roomCode: this.activeSyncRoom,
            sapProducts: sapProducts || [],
            lastUpdatedBy: this.currentUser.uid,
            updatedAt: new Date().toISOString()
          }, { merge: true });
          showToast("Změny odeslány do propojených zařízení!");
        } catch(e) {
          console.error("Error pushing state:", e);
        }
      }
    };
  </script>

  <script>
    // Functions for Cloud Sync Room Management
    function joinCloudRoomFromInput() {
      const val = document.getElementById('syncRoomInput').value;
      if (!val) {
        showToast("Zadejte kód propojení.");
        return;
      }
      if (window.CloudSync) {
        window.CloudSync.joinRoom(val);
        renderSyncQrCode(val);
      }
    }

    function generateRandomSyncRoom() {
      const randomPin = 'ZMTZ-' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('syncRoomInput').value = randomPin;
      joinCloudRoomFromInput();
    }

    function pushCurrentStateToCloud() {
      if (window.CloudSync && window.CloudSync.activeSyncRoom) {
        window.CloudSync.pushState();
      } else {
        showToast("Nejprve se připojte k místnosti.");
      }
    }

    function renderSyncQrCode(roomCode) {
      const qrEl = document.getElementById('syncQrContainer');
      if (!qrEl) return;
      qrEl.innerHTML = '';
      try {
        new QRCode(qrEl, { text: `SKLADNIKPRO_ROOM:${roomCode}`, width: 120, height: 120 });
      } catch(e) {}
    }
  </script>
